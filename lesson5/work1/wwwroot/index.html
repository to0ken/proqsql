<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Журнал студентов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            color: #2c3e50;
        }

        table {
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }

        th, td {
            padding: 10px 20px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        tr:hover {
            background: #f0f7ff;
        }

        #error {
            color: #c0392b;
        }
    </style>
</head>
<body>
    <h1>Список студентов</h1>
    <button onclick="loadAllStudents()">Студенты</button>
    <button onclick="loadAllGroup()">Группы</button>
    <p id="error"></p>
    <table id="studentsTable" style="display:none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>      
                <th>Возраст</th>
                <th>группа</th>
            </tr>
        </thead>
        <tbody id="bodyTable"</tbody>
    </table>

    <form id="createUserForm">
        <label>
            <input type="text" id="first_name" placeholder="имя" />
        </label>
        <label>
            <input type="text" id="lust_name" placeholder="фамилия" />
        </label>
        <label>
            <input type="number" id="age" placeholder="возраст" />
        </label>
        <label>
            <input type="number" id="group_id" placeholder="группа" />
        </label>
        <button onclick="CreateStudent()">сощдать
        </button>

    </form>

    <table id="groupTable" style="display:none">
        <thead>
            <tr>
                <th>id</th>
                <th>имя группы</th>

            </tr>
        </thead>
    </table>

    <script src="js/routes.js"></script>
    <script>

        loadAllStudents();
        loadAllGroup();
    </script>
</body>
</html>
